<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI+用研资讯周报</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f4f5f7;--card:#fff;--border:#e5e7eb;--text:#1a1a1a;--text2:#6b7280;
  --blue:#2563eb;--blue-bg:#eff6ff;--radius:8px;
  --tag-product:#dc2626;--tag-free:#16a34a;--tag-paper:#7c3aed;
  --tag-report:#ea580c;--tag-case:#2563eb;--tag-method:#0891b2;--tag-opinion:#ca8a04;
}
html{font-size:15px;-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);line-height:1.7;min-height:100vh}

/* ---- Layout ---- */
.app{display:grid;grid-template-columns:260px 1fr;grid-template-rows:auto 1fr;min-height:100vh}
.header{grid-column:1/-1;background:var(--card);border-bottom:1px solid var(--border);
  padding:16px 28px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
.header h1{font-size:1.15rem;font-weight:700;letter-spacing:.02em}
.header h1 span{color:var(--blue)}
.header-meta{font-size:.78rem;color:var(--text2)}
.header-left{display:flex;align-items:center;gap:12px}
.menu-btn{display:none;background:none;border:none;font-size:1.3rem;cursor:pointer;padding:4px 8px;color:var(--text)}

.sidebar{grid-row:2;background:var(--card);border-right:1px solid var(--border);
  padding:16px 0;overflow-y:auto;position:sticky;top:56px;height:calc(100vh - 56px)}
.sidebar-title{font-size:.75rem;font-weight:600;color:var(--text2);text-transform:uppercase;
  letter-spacing:.08em;padding:0 20px 10px;border-bottom:1px solid var(--border)}
.sidebar-list{list-style:none;padding:6px 0}
.sidebar-item{padding:10px 20px;cursor:pointer;font-size:.85rem;display:flex;align-items:center;gap:8px;
  transition:background .15s;border-left:3px solid transparent}
.sidebar-item:hover{background:#f9fafb}
.sidebar-item.active{background:var(--blue-bg);border-left-color:var(--blue);font-weight:600;color:var(--blue)}
.sidebar-item .dot{width:6px;height:6px;border-radius:50%;background:var(--border);flex-shrink:0}
.sidebar-item.active .dot{background:var(--blue)}
.sidebar-item .count{margin-left:auto;font-size:.72rem;color:var(--text2);background:var(--bg);
  padding:1px 6px;border-radius:10px}

.main{grid-row:2;padding:24px 32px 60px;max-width:860px;width:100%}

/* ---- Controls ---- */
.controls{display:flex;align-items:center;gap:12px;margin-bottom:24px;flex-wrap:wrap}
.version-toggle{display:inline-flex;background:var(--bg);border-radius:6px;padding:2px;gap:2px}
.version-btn{padding:6px 16px;border:none;background:none;border-radius:5px;cursor:pointer;
  font-size:.82rem;font-weight:500;color:var(--text2);transition:all .15s}
.version-btn.active{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.report-date{font-size:.92rem;font-weight:600;margin-left:auto;color:var(--text2)}
.report-stats{font-size:.78rem;color:var(--text2);width:100%;margin-top:4px}

/* ---- Content typography ---- */
.report-content{animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.report-content h1{font-size:1.5rem;font-weight:700;margin:0 0 20px;padding-bottom:12px;border-bottom:2px solid var(--blue)}
.report-content h2{font-size:1.2rem;font-weight:700;margin:32px 0 16px;padding:8px 14px;
  background:var(--blue-bg);border-radius:var(--radius);border-left:4px solid var(--blue)}
.report-content h3{font-size:1.02rem;font-weight:600;margin:24px 0 10px;line-height:1.5}
.report-content h3 code{background:#f3f4f6;padding:2px 8px;border-radius:4px;font-size:.82rem;
  font-family:"SF Mono",Menlo,monospace;color:var(--text2);margin-left:4px}
.report-content p{margin:6px 0;line-height:1.8}
.report-content .summary{font-size:.95rem;color:var(--blue);font-weight:500;margin:8px 0 12px}
.report-content ol{padding-left:22px;margin:6px 0}
.report-content ol li{margin:4px 0;line-height:1.7}
.report-content blockquote{margin:8px 0 4px;padding:6px 14px;font-size:.85rem;color:var(--text2);
  border-left:3px solid var(--border);background:#fafbfc;border-radius:0 4px 4px 0}
.report-content blockquote a{color:var(--blue);text-decoration:none;word-break:break-all}
.report-content blockquote a:hover{text-decoration:underline}
.report-content hr{border:none;border-top:1px solid var(--border);margin:28px 0}

/* ---- Simple version ---- */
.simple-list{list-style:none;padding:0}
.simple-list li{padding:12px 16px;border-bottom:1px solid var(--border);line-height:1.7;font-size:.9rem}
.simple-list li:last-child{border-bottom:none}
.simple-list li strong{font-weight:600}

/* ---- Type tags ---- */
.tag{display:inline-block;font-size:.72rem;font-weight:600;padding:1px 7px;border-radius:3px;
  vertical-align:middle;margin:0 2px;letter-spacing:.02em}
.tag-商业产品{background:#fef2f2;color:var(--tag-product)}
.tag-免费工具{background:#f0fdf4;color:var(--tag-free)}
.tag-学术论文{background:#f5f3ff;color:var(--tag-paper)}
.tag-行业报告{background:#fff7ed;color:var(--tag-report)}
.tag-实践案例{background:var(--blue-bg);color:var(--tag-case)}
.tag-方法论{background:#ecfeff;color:var(--tag-method)}
.tag-观点讨论{background:#fefce8;color:var(--tag-opinion)}

/* ---- Empty / loading states ---- */
.empty-state{text-align:center;padding:80px 20px;color:var(--text2)}
.empty-state .icon{font-size:3rem;margin-bottom:16px;opacity:.4}
.empty-state p{font-size:.95rem;margin:6px 0}
.empty-state code{background:#f3f4f6;padding:2px 8px;border-radius:4px;font-size:.82rem}

/* ---- Footer ---- */
.footer{margin-top:40px;padding-top:16px;border-top:1px solid var(--border);
  font-size:.75rem;color:var(--text2);text-align:center}

/* ---- Responsive ---- */
@media(max-width:820px){
  .app{grid-template-columns:1fr}
  .sidebar{display:none;position:fixed;left:0;top:56px;bottom:0;width:280px;z-index:20;
    box-shadow:4px 0 20px rgba(0,0,0,.12)}
  .sidebar.open{display:block}
  .menu-btn{display:block}
  .main{padding:20px 16px 40px}
  .overlay{display:none;position:fixed;inset:0;top:56px;background:rgba(0,0,0,.3);z-index:15}
  .overlay.open{display:block}
}
@media(max-width:480px){
  .header{padding:12px 16px}
  .header h1{font-size:1rem}
  .controls{flex-direction:column;align-items:flex-start}
  .report-date{margin-left:0}
}

/* Print */
@media print{
  .sidebar,.header,.controls,.menu-btn{display:none!important}
  .app{display:block}.main{max-width:100%;padding:0}
}
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <div class="header-left">
      <button class="menu-btn" onclick="toggleSidebar()" aria-label="菜单">&#9776;</button>
      <h1><span>AI+</span>用研资讯周报</h1>
    </div>
    <div class="header-meta" id="headerMeta"></div>
  </header>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-title">历史周报</div>
    <ul class="sidebar-list" id="sidebarList"></ul>
  </aside>
  <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

  <main class="main" id="main">
    <div class="controls" id="controls" style="display:none">
      <div class="version-toggle">
        <button class="version-btn active" data-version="full" onclick="switchVersion('full')">完整版</button>
        <button class="version-btn" data-version="simple" onclick="switchVersion('simple')">简版</button>
      </div>
      <span class="report-date" id="reportDate"></span>
      <div class="report-stats" id="reportStats"></div>
    </div>
    <div class="report-content" id="reportContent">
      <div class="empty-state">
        <div class="icon">&#128240;</div>
        <p>正在加载周报数据...</p>
      </div>
    </div>
    <div class="footer">AI+用研资讯周报 &middot; 由 QoderWork 自动生成发布</div>
  </main>
</div>

<script>
// ======== State ========
let REPORTS = [];
let currentIndex = 0;
let currentVersion = 'full';

// ======== Init ========
async function init() {
  try {
    const resp = await fetch('reports.json?t=' + Date.now());
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    REPORTS = await resp.json();
    if (!Array.isArray(REPORTS) || REPORTS.length === 0) {
      showEmpty('暂无周报数据', '等待第一次周报生成后自动更新');
      return;
    }
    // Sort by date descending
    REPORTS.sort((a, b) => b.date_start.localeCompare(a.date_start));
    renderSidebar();
    selectReport(0);
    updateHeaderMeta();
  } catch (e) {
    showEmpty('无法加载周报数据', '请确认 reports.json 存在。错误: ' + e.message);
  }
}

function showEmpty(title, desc) {
  document.getElementById('reportContent').innerHTML =
    '<div class="empty-state"><div class="icon">&#128240;</div><p>' + title + '</p><p style="font-size:.82rem">' + desc + '</p></div>';
}

function updateHeaderMeta() {
  const n = REPORTS.length;
  document.getElementById('headerMeta').textContent = '共 ' + n + ' 期周报';
}

// ======== Sidebar ========
function renderSidebar() {
  const list = document.getElementById('sidebarList');
  list.innerHTML = REPORTS.map((r, i) => {
    const label = formatDateLabel(r.date_start, r.date_end);
    const count = r.count || '';
    return '<li class="sidebar-item' + (i === currentIndex ? ' active' : '') + '" onclick="selectReport(' + i + ')">' +
      '<span class="dot"></span>' + label +
      (count ? '<span class="count">' + count + '条</span>' : '') + '</li>';
  }).join('');
}

function formatDateLabel(start, end) {
  // "2026-09-01" -> "9.1-9.7"
  const s = start.split('-');
  const e = end.split('-');
  return parseInt(s[1]) + '.' + parseInt(s[2]) + '-' + parseInt(e[1]) + '.' + parseInt(e[2]);
}

// ======== Report Selection ========
function selectReport(index) {
  currentIndex = index;
  renderSidebar();
  renderReport();
  // Close mobile sidebar
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('open');
  // Scroll to top
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderReport() {
  const r = REPORTS[currentIndex];
  if (!r) return;

  // Show controls
  document.getElementById('controls').style.display = 'flex';

  // Update date
  document.getElementById('reportDate').textContent =
    r.date_start.replace(/-/g, '/') + ' — ' + r.date_end.replace(/-/g, '/');

  // Update stats
  if (r.count) {
    document.getElementById('reportStats').textContent = '本期收录 ' + r.count + ' 条资讯';
  } else {
    document.getElementById('reportStats').textContent = '';
  }

  // Render content
  const content = currentVersion === 'full' ? r.full : r.simple;
  const html = currentVersion === 'full' ? renderFullMarkdown(content) : renderSimpleMarkdown(content);
  document.getElementById('reportContent').innerHTML = html;
}

// ======== Version Toggle ========
function switchVersion(version) {
  currentVersion = version;
  document.querySelectorAll('.version-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.version === version);
  });
  renderReport();
}

// ======== Markdown Parsers ========
function escapeHtml(text) {
  return text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function inlineFormat(text) {
  // Bold
  text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  // Links
  text = text.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  return text;
}

function renderTag(match) {
  const name = match.replace(/[\[\]`]/g, '');
  return '<span class="tag tag-' + name + '">' + name + '</span>';
}

function renderFullMarkdown(md) {
  if (!md) return '<p class="empty-state">暂无完整版内容</p>';

  const lines = md.split('\n');
  let html = '';
  let inList = false;
  let inBlockquote = false;

  for (let i = 0; i < lines.length; i++) {
    let line = lines[i];
    const trimmed = line.trim();

    // Close open lists/blockquotes if needed
    if (!trimmed.startsWith('- ') && inList && !trimmed.startsWith('  ')) {
      html += '</ol>'; inList = false;
    }
    if (!trimmed.startsWith('>') && inBlockquote) {
      html += '</blockquote>'; inBlockquote = false;
    }

    // Empty line
    if (!trimmed) {
      if (inList) { html += '</ol>'; inList = false; }
      continue;
    }

    // Horizontal rule
    if (/^---+$/.test(trimmed)) {
      html += '<hr>'; continue;
    }

    // H1
    if (trimmed.startsWith('# ') && !trimmed.startsWith('## ')) {
      html += '<h1>' + inlineFormat(escapeHtml(trimmed.slice(2))) + '</h1>'; continue;
    }

    // H2
    if (trimmed.startsWith('## ')) {
      html += '<h2>' + inlineFormat(escapeHtml(trimmed.slice(3))) + '</h2>'; continue;
    }

    // H3 - item title
    if (trimmed.startsWith('### ')) {
      let title = trimmed.slice(4);
      // Extract type tag
      title = title.replace(/`?\[([^\]]+)\]`?/g, renderTag);
      title = inlineFormat(escapeHtml(title));
      html += '<h3>' + title + '</h3>'; continue;
    }

    // Summary line (starts with lightbulb emoji)
    if (trimmed.startsWith('\u{1F4A1}') || trimmed.startsWith('💡')) {
      html += '<p class="summary">' + inlineFormat(escapeHtml(trimmed)) + '</p>'; continue;
    }

    // Blockquote (price, source, date)
    if (trimmed.startsWith('>')) {
      let content = trimmed.replace(/^>\s*/, '');
      if (!inBlockquote) { html += '<blockquote>'; inBlockquote = true; }
      // Format links and tags in blockquote
      content = content.replace(/`?\[([^\]]+)\]`?/g, renderTag);
      content = inlineFormat(escapeHtml(content));
      html += content + '<br>'; continue;
    }

    // Ordered list (numbered highlights)
    if (/^\d+[.)]\s/.test(trimmed)) {
      if (!inList) { html += '<ol>'; inList = true; }
      let content = trimmed.replace(/^\d+[.)]\s*/, '');
      content = content.replace(/`?\[([^\]]+)\]`?/g, renderTag);
      html += '<li>' + inlineFormat(escapeHtml(content)) + '</li>'; continue;
    }

    // Regular paragraph
    let p = trimmed;
    p = p.replace(/`?\[([^\]]+)\]`?/g, renderTag);
    html += '<p>' + inlineFormat(escapeHtml(p)) + '</p>';
  }

  if (inList) html += '</ol>';
  if (inBlockquote) html += '</blockquote>';

  return html;
}

function renderSimpleMarkdown(md) {
  if (!md) return '<p class="empty-state">暂无简版内容</p>';

  const lines = md.split('\n').filter(l => l.trim());
  let html = '<ul class="simple-list">';

  for (const line of lines) {
    let trimmed = line.trim();
    // Skip headers
    if (trimmed.startsWith('#')) continue;
    // Remove leading "- " or "* "
    if (trimmed.startsWith('- ') || trimmed.startsWith('* ')) {
      trimmed = trimmed.slice(2);
    }
    // Format tags
    trimmed = trimmed.replace(/`?\[([^\]]+)\]`?/g, renderTag);
    trimmed = inlineFormat(escapeHtml(trimmed));
    html += '<li>' + trimmed + '</li>';
  }

  html += '</ul>';
  return html;
}

// ======== Mobile Sidebar ========
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('open');
}

// ======== Keyboard shortcuts ========
document.addEventListener('keydown', function(e) {
  if (e.key === 'ArrowLeft' && currentIndex > 0) selectReport(currentIndex - 1);
  if (e.key === 'ArrowRight' && currentIndex < REPORTS.length - 1) selectReport(currentIndex + 1);
  if (e.key === 'f' && !e.ctrlKey && !e.metaKey && document.activeElement === document.body) switchVersion('full');
  if (e.key === 's' && !e.ctrlKey && !e.metaKey && document.activeElement === document.body) switchVersion('simple');
});

// ======== Start ========
init();
</script>
</body>
</html>
